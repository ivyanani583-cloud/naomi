<html lang="en">

<meta charset="UTF-8">

<title> Quiz | IQ Tech</title>

<style>
/* (Same CSS as before, only minor tweaks for MCQs) */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
header { width: 100%; background: #003366; color: white; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; border-radius: 10px 10px 0 0; margin-bottom: 10px; }
nav { display: flex; justify-content: center; align-items: center; gap: 30px; background: #0055aa; padding: 12px; width: 100%; border-radius: 0 0 20px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
nav a { color: white; text-decoration: none; font-weight: bold; font-size: 15px; transition: 0.3s; }
nav a:hover { color: #ffd700; }
.page { display: flex; justify-content: center; gap: 20px; width: 100%; max-width: 1200px; align-items: flex-start; }
.ad-side { width: 160px; background: #ddd; text-align: center; padding: 10px; font-weight: bold; border-radius: 10px; min-height: 300px; display: flex; justify-content: center; align-items: center; }
.container { flex: 1; max-width: 900px; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 25px; box-shadow: 0 25px 60px rgba(0,0,0,0.35); padding: 40px; transition: 0.3s ease; }
.ad-inline { margin: 20px 0; background: #ccc; padding: 15px; text-align: center; font-weight: bold; border-radius: 8px; }
.setup { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
.setup input { padding: 14px; border-radius: 12px; border: 1px solid #ddd; font-size: 15px; transition: 0.3s; }
.setup input:focus { outline: none; border-color: #1e3c72; box-shadow: 0 0 10px rgba(30,60,114,0.3); }
button { padding: 14px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.3s ease; }
.start-btn { width: 100%; background: #1e3c72; color: white; margin-bottom: 15px; }
.start-btn:hover { background: #2a5298; transform: translateY(-2px); }
.nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
.nav-buttons button { background: #2a5298; color: white; flex: 1; }
.nav-buttons button:hover { background: #1e3c72; }
#submitAll { display: none; width: 100%; margin-top: 20px; background: #28a745; color: white; }
#submitAll:hover { background: #1f7d36; }
.timer { text-align: center; font-weight: bold; font-size: 18px; margin: 20px 0; color: #c0392b; }
.question-box { background: #f8f9fb; padding: 18px; border-radius: 18px; margin-bottom: 15px; border: 1px solid #eee; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
.question-box p { margin-bottom: 8px; font-weight: 500; }
.feedback { margin-top: 6px; font-weight: bold; }
.correct { color: #28a745; }
.wrong { color: #c0392b; }
#scoreBox { margin-top: 20px; padding: 15px; border-radius: 15px; background: #eafaf1; border-left: 6px solid #28a745; font-weight: bold; text-align: center; font-size: 18px; }
.ad-bottom { width: 100%; background: #ccc; text-align: center; padding: 15px; font-weight: bold; border-radius: 8px; margin-top: 20px; }
@media(max-width:900px){ .ad-side { display: none; } .setup { grid-template-columns: 1fr; } }
</style>
</head>

<div class="page">

    <div class="ad-inline">Top Banner Ad</div>

    <button id="submitAll" onclick="submitQuiz()">Submit Quiz</button>

    <div class="ad-bottom">Bottom Banner Ad</div>

let questions = [];
let userAnswers = [];
let results = [];
let currentPage = 0;
let totalQuestions = 0;
let timerInterval;
let quizSubmitted = false;
const pageSize = 5;

// SHUFFLE
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// START QUIZ
function startQuiz(){
  const count = parseInt(document.getElementById("range").value);
  const minutes = parseInt(document.getElementById("timeLimit").value);

  if(!count || !minutes || count > questionsOriginal.length){
    alert("Enter valid number of questions and time.");
    return;
  }

  clearInterval(timerInterval);
  document.getElementById("scoreBox").innerHTML="";
  document.getElementById("timer").innerText="";
  document.getElementById("submitAll").style.display="none";

  questions = shuffle([...questionsOriginal]).slice(0,count);
  totalQuestions = questions.length;
  userAnswers = Array(totalQuestions).fill("");
  results = Array(totalQuestions).fill(null);
  quizSubmitted = false;
  currentPage = 0;

  loadPage();
  startTimer(minutes*60);
}

// TIMER
function startTimer(seconds){
  timerInterval = setInterval(()=>{
    let m=Math.floor(seconds/60);
    let s=seconds%60;

    document.getElementById("timer").innerText=
      `Time Left: ${m}:${s.toString().padStart(2,'0')}`;

    if(seconds <= 0){
      clearInterval(timerInterval);
      submitQuiz();
    }
    seconds--;
  },1000);
}

// LOAD PAGE
function loadPage(){
  const area = document.getElementById("quizArea");
  area.innerHTML="";

  const start=currentPage*pageSize;
  const end=Math.min(start+pageSize,totalQuestions);

  for(let i=start;i<end;i++){
    let disabled = quizSubmitted ? "disabled" : "";
    let optionsHtml = questions[i].options.map(opt =>
      `<label>
         <input type="radio" name="q${i}" value="${opt}" ${userAnswers[i]===opt?"checked":""} ${disabled} 
           onclick="saveAnswer(${i},'${opt}')"> ${opt}
       </label><br>`
    ).join("");

    area.innerHTML+=`
      <div class="question-box">
        <p><b>Q${i+1}.</b> ${questions[i].q}</p>
        ${optionsHtml}
        <div class="feedback ${results[i]===true?'correct':results[i]===false?'wrong':''}" id="fb${i}">
          ${results[i]===true ? "Correct!" :
            results[i]===false ? "Wrong! Correct: "+questions[i].answer : ""}
        </div>
      </div>`;
  }

  document.getElementById("prevBtn").style.display =
    currentPage===0 ? "none":"inline-block";

  document.getElementById("nextBtn").style.display =
    end===totalQuestions ? "none":"inline-block";

  checkIfAllAnswered();
}

// SAVE ANSWER
function saveAnswer(index,value){
  userAnswers[index] = value;
  checkIfAllAnswered();
}

// CHECK IF ALL ANSWERED
function checkIfAllAnswered(){
  const allAnswered = userAnswers.every(ans => ans !== "");
  if(!quizSubmitted){
    document.getElementById("submitAll").style.display =
      allAnswered ? "block" : "none";
  }
}

// NAVIGATION
function prevPage(){
  if(currentPage>0){
    currentPage--;
    loadPage();
  }
}

function nextPage(){
  if((currentPage+1)*pageSize<totalQuestions){
    currentPage++;
    loadPage();
  }
}

// SUBMIT QUIZ
function submitQuiz(){
  if(quizSubmitted) return;

  clearInterval(timerInterval);
  quizSubmitted = true;

  let score=0;

  for(let i=0;i<totalQuestions;i++){
    const correct = userAnswers[i] === questions[i].answer;
    results[i] = correct;
    if(correct) score++;
  }

  document.getElementById("submitAll").style.display="none";
  document.getElementById("scoreBox").innerHTML=
    `Your Score: ${score} / ${totalQuestions}`;

  loadPage();
}
</script>
